name: Guided Review

# Builds the PR's tour with this checkout's own Guided Review and posts it to the PR, where
# `gr review` picks it up. Other repositories use the published action instead (see https://haydenmeloche.github.io/guided-review/ci.html).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write # post the tour comment

concurrency:
  group: guided-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tour:
    # Fork PRs get no secrets and a read-only token.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GR_HOME: ${{ github.workspace }}/../gr-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # diff against the merge base, as reviewers' local builds do
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Write config
        run: |
          mkdir -p "$GR_HOME"
          cat > "$GR_HOME/config.json" <<'JSON'
          {
            "provider": "anthropic",
            "model": "claude-haiku-5-5",
            "apiKeyEnv": "ANTHROPIC_API_KEY"
          }
          JSON
          chmod 600 "$GR_HOME/config.json"
      - name: Build and post the tour
        run: node bin/gr.js build "${{ github.event.pull_request.number }}" --comment
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
